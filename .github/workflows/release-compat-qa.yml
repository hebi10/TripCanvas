name: TripCanvas Release Compatibility QA

on:
  pull_request:
    paths:
      - '.github/workflows/release-compat-qa.yml'
      - '.github/scripts/run-release-compat-qa.sh'
      - '.github/scripts/run-android-instrumentation.sh'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-compat:
    name: api-${{ matrix.api }}-room-and-launch
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room migration and 160-percent-font launch smoke QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-release-compat-qa.sh ${{ matrix.api }}

      - name: Preserve test reports and startup screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-release-compat-api${{ matrix.api }}
          path: qa-output/compat/
          if-no-files-found: warn
          retention-days: 14

  privacy-policy-public:
    name: public-policy-http-and-content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require publicly readable privacy policy
        env:
          PRIVACY_URL: https://hebi10.github.io/TripCanvas/privacy-policy.html
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 2 --max-time 25 \
            --output "$RUNNER_TEMP/tripcanvas-policy.html" \
            --write-out 'Privacy policy HTTP status: %{http_code}\n' "$PRIVACY_URL"
          grep -Fq 'TripCanvas 개인정보처리방침' "$RUNNER_TEMP/tripcanvas-policy.html"
          grep -Fq 'OpenFreeMap' "$RUNNER_TEMP/tripcanvas-policy.html"
          grep -Fq 'Photon' "$RUNNER_TEMP/tripcanvas-policy.html"
