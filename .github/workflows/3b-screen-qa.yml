name: TripCanvas 3-B Finance Booking Screen QA

on:
  pull_request:
    paths:
      - '.github/workflows/3b-screen-qa.yml'
      - '.github/scripts/run-3b-screen-qa.sh'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-booking-screen-qa:
    name: 3b-screen-qa-${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            resolution: 1080x2400
            density: '420'
          - device: tablet
            resolution: 1600x2560
            density: '320'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real finance, participants and booking screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-3b-screen-qa.sh ${{ matrix.resolution }} ${{ matrix.density }}

      - name: Archive screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-3b-screens-${{ matrix.device }}
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
