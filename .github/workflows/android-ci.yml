name: TripCanvas Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact frozen main SHA for complete device QA'
        type: string
        required: true
  workflow_call:
    inputs:
      expected_main_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate-source:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Final QA must run on main"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]] || { echo "::error::SHA mismatch"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || { echo "::error::main changed"; exit 1; }

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release automation guards without credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_release*.py'
          python3 -m unittest discover -s scripts/play/tests -p 'test_*.py'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle Wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify ads-enabled merged manifest with public test IDs
        env:
          TRIPCANVAS_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
          TRIPCANVAS_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/6300978111
        run: ./gradlew :app:verifyDebugAdsManifest --stacktrace

      - name: Verify the release bundle requires the manifest check
        run: |
          ./gradlew :app:bundleRelease --dry-run --console=plain > "$RUNNER_TEMP/tripcanvas-bundle-tasks.txt"
          grep -Fx ':app:verifyReleaseAdsManifest SKIPPED' "$RUNNER_TEMP/tripcanvas-bundle-tasks.txt"

      - name: Compile app, instrumentation tests and run JVM tests
        run: ./gradlew :app:verifyDebugAdsManifest :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --stacktrace

      - name: Archive debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  room-migration-instrumentation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    needs: [android-build, validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle Wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 35 Room migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash .github/scripts/run-android-instrumentation.sh

      - name: Preserve actual Android diagnostics and original test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-main-android-diagnostics-${{ github.run_id }}
          path: qa-output/instrumentation/
          retention-days: 14
          if-no-files-found: warn

