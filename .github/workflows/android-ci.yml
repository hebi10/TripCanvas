name: TripCanvas Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release automation guards without credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_release*.py'
          python3 -m unittest discover -s scripts/play/tests -p 'test_*.py'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle Wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Archive debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  room-migration-instrumentation:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle Wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 35 Room migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.hebi.tripcanvas.data.backup.TripBackupRestoreTest,com.hebi.tripcanvas.data.local.TripDatabaseMigrationTest,com.hebi.tripcanvas.data.local.TripDatabaseV2MigrationTest,com.hebi.tripcanvas.data.local.TripDatabaseV3MigrationTest,com.hebi.tripcanvas.data.search.PhotonPlaceSearchTest,com.hebi.tripcanvas.data.local.TripDatabaseV4MigrationTest,com.hebi.tripcanvas.data.local.TripFinanceBookingIntegrationTest

