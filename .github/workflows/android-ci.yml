name: Android Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle Wrapper caching
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Archive debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-designsystem-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
