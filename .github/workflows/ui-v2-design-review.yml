name: TripCanvas V2 Design Evidence (single design branch)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/ui-v2-design-review.yml'

permissions:
  contents: read

concurrency:
  group: design-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  design-evidence:
    if: github.repository == 'hebi10/TripCanvas' && github.event.pull_request.head.repo.full_name == 'hebi10/TripCanvas' && github.head_ref == 'ui/tc-design-v2-core-20261125'
    name: design-${{ matrix.suite }}-phone
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            script: .github/scripts/run-2c-screen-qa.sh
          - suite: map
            script: .github/scripts/run-3a-map-qa.sh
          - suite: finance-booking
            script: .github/scripts/run-3b-screen-qa.sh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate source and record provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SUITE: ${{ matrix.suite }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p qa-output
          printf 'head_sha=%s\nsuite=%s\napi=35\nresolution=1080x2400\ndensity=420\n' "$EXPECTED_SHA" "$SUITE" > qa-output/design-evidence.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual MainActivity and exercise existing QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ${{ matrix.script }} 1080x2400 420
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-v2-${{ matrix.suite }}-${{ github.event.pull_request.head.sha }}
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
