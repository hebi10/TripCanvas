name: TripCanvas Korean Play listing images

on:
  pull_request:
    paths:
      - 'assets/play-store/ko-KR/**'
      - 'scripts/play/listing_images.py'
      - 'scripts/play/verify_listing_assets.py'
      - 'scripts/play/tests/test_listing_images.py'
      - '.github/workflows/play-listing-images.yml'
  # FINAL-RELEASE-FREEZE: validation may run on PR; uploads require explicit manual request.
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'Separate approval for reviewed Play image update after all QA'
        required: true
        type: boolean
        default: false
      ops06_confirmation:
        description: 'For upload type APPLY_VERIFIED_PLAY_STORE_ASSETS'
        required: false
        type: string
      ops06_expected_main_sha:
        description: 'Exact current approved main commit SHA'
        required: false
        type: string
      ops06_batch_id:
        description: 'KST release batch YYYY-MM-DD-tripcanvas'
        required: false
        type: string
      mode:
        description: 'check = validate assets only; upload = manual ko-KR Play edit'
        type: choice
        required: true
        default: check
        options: [check, upload]
      final_release_confirmed:
        description: 'Only after all planned changes and final release approval'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: play-com-hebi-tripcanvas
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'hebi10/TripCanvas'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact Korean image set, file sizes and SHA-256
        run: |
          python3 scripts/play/verify_listing_assets.py
          python3 -m unittest discover -s scripts/play/tests -p 'test_listing_images.py'
          python3 scripts/play/listing_images.py

  upload:
    needs: validate
    if: >-
      github.repository == 'hebi10/TripCanvas' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'upload' && inputs.final_release_confirmed == true &&
      inputs.ops06_store_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require one-time authorized merge title on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git show -s --format=%s HEAD)"
          if [[ "$subject" != 'store: TripCanvas STORE-03 Korean listing [tripcanvas-store03-listing-once]' &&
                "$subject" != 'fix: TripCanvas STORE-03 safe Play retry [tripcanvas-store03-retry-once]' ]]; then
            echo 'Unapproved Play listing push blocked'
            exit 1
          fi
      - name: Refuse a stale main revision before changing Play
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api repos/hebi10/TripCanvas/git/ref/heads/main --jq .object.sha)"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: OPS-06 verify store asset approval, immutable source and KST batch
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Read authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        if: steps.credentials.outputs.auth_mode == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with existing legacy service-account credentials
        if: steps.credentials.outputs.auth_mode == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Update only ko-KR icon, feature graphic and eight phone screenshots
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/play/listing_images.py --apply
      - name: Report API status without claiming review approval
        if: success()
        run: echo 'TripCanvas ko-KR image edit committed and fresh readback matched. Console review, publication and tester installability are separate.' >> "$GITHUB_STEP_SUMMARY"


  r09-final:
    needs: validate
    # Historical one-time path frozen; no push trigger remains.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact approved release source and current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/play')
          from listing_images import require_r09_source
          require_r09_source()
          PY
          remote_sha="$(gh api repos/hebi10/TripCanvas/git/ref/heads/main --jq .object.sha)"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Read existing Google Play authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        if: steps.credentials.outputs.auth_mode == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with existing legacy service-account credentials
        if: steps.credentials.outputs.auth_mode == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Commit ten ko-KR images and promote existing internal v10 atomically
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/play/listing_images.py --r09-final --report output/play-store-r09-final.json
      - name: Preserve verified non-secret Play response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-store-r09-final-${{ github.run_id }}
          path: output/play-store-r09-final.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Distinguish API result from Console publication
        if: success()
        run: |
          echo 'Google Play accepted one edit: 10 ko-KR images + existing internal versionCode 10 promoted to alpha completed; fresh image/alpha readback matched.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review, publication and tester installation still require Play Console verification. No new AAB or production deployment.' >> "$GITHUB_STEP_SUMMARY"
