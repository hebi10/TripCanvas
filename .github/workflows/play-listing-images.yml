name: TripCanvas Korean Play listing images

on:
  pull_request:
    paths:
      - 'assets/play-store/ko-KR/**'
      - 'scripts/play/listing_images.py'
      - 'scripts/play/verify_listing_assets.py'
      - 'scripts/play/tests/test_listing_images.py'
      - '.github/workflows/play-listing-images.yml'
  # STORE-03 user-authorized one-time main merge. All later changes use manual dispatch.
  push:
    branches: [main]
    paths:
      - 'assets/play-store/ko-KR/**'
      - '.github/workflows/play-listing-images.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = validate assets only; upload = manual ko-KR Play edit'
        type: choice
        required: true
        default: check
        options: [check, upload]

permissions:
  contents: read

concurrency:
  group: play-com-hebi-tripcanvas
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'hebi10/TripCanvas'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact Korean image set, file sizes and SHA-256
        run: |
          python3 scripts/play/verify_listing_assets.py
          python3 -m unittest discover -s scripts/play/tests -p 'test_listing_images.py'
          python3 scripts/play/listing_images.py

  upload:
    needs: validate
    if: >-
      github.repository == 'hebi10/TripCanvas' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'upload') ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[tripcanvas-store03-listing-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require one-time authorized merge title on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%s HEAD)" = "store: TripCanvas STORE-03 Korean listing [tripcanvas-store03-listing-once]"
      - name: Refuse a stale main revision before changing Play
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api repos/hebi10/TripCanvas/git/ref/heads/main --jq .object.sha)"
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Read authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        if: steps.credentials.outputs.auth_mode == 'wif'
        id: wif
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with existing legacy service-account credentials
        if: steps.credentials.outputs.auth_mode == 'json'
        id: json
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Update only ko-KR icon, feature graphic and eight phone screenshots
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/play/listing_images.py --apply
      - name: Report API status without claiming review approval
        if: success()
        run: echo 'TripCanvas ko-KR image edit committed and fresh readback matched. Console review, publication and tester installability are separate.' >> "$GITHUB_STEP_SUMMARY"
