name: TripCanvas V2 Expense Design Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/ui-v2-expense-review.yml'
      - '.github/scripts/run-3b-screen-qa.sh'
      - '.github/scripts/run-design-evidence-qa.sh'

permissions:
  contents: read

concurrency:
  group: design-v2-expense-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  design-evidence:
    if: github.repository == 'hebi10/TripCanvas' && github.event.pull_request.head.repo.full_name == 'hebi10/TripCanvas' && github.head_ref == 'ui/tc-design-v2-expense-20261125'
    name: design-expense-phone
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate source and record provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SUITE: expense
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p qa-output
          printf 'head_sha=%s\nsuite=%s\napi=35\nresolution=1080x2400\ndensity=420\n' "$EXPECTED_SHA" "$SUITE" > qa-output/design-evidence.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual MainActivity and exercise existing QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-design-evidence-qa.sh .github/scripts/run-3b-screen-qa.sh 1080x2400 420
      - name: Require new expense and split evidence
        run: |
          for name in f01-split-preview-light f02-rate-reset-confirm f03-rate-reset-cancel f04-expense-form-light f05-expense-form-dark-font160; do
            test -s "qa-output/screenshots/qa3b/$name.png" || { echo "Missing expense evidence: $name"; exit 1; }
          done
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-v2-expense-${{ github.event.pull_request.head.sha }}
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
