name: DEX-05 request existing verified internal publisher

on:
  push:
    branches:
      - ops/dex05-internal-17

permissions:
  actions: write
  contents: read

concurrency:
  group: dex05-approved-internal-17
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request only the existing guarded OPS-04 publisher on exact main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: '532b50df842b97b9954d5d06eca76217e5ca4b1d'
          APPROVED_INPUTS: '{"mode":"publish","expected_main_sha":"532b50df842b97b9954d5d06eca76217e5ca4b1d","build_run_id":"45977276460","artifact_name":"tripcanvas-signed-release-17","aab_sha256":"b20ac5ffd4d09c27a734bea90097fea4708620bd184990b0d863a3243785bc8c","version_code":"17","version_name":"0.1.0","batch_id":"2026-11-27-tripcanvas","final_release_approved":"true","approval_phrase":"PUBLISH_VERIFIED_INTERNAL_AAB"}'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/dex05-internal-17'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/play-internal-release.yml/runs" --method GET -f branch=main -f event=workflow_dispatch -f "head_sha=$RELEASE_SHA" --jq .total_count)"
          if [[ "$existing" != "0" ]]; then
            echo "::error::An OPS-04 run already exists for this source. Inspect its result before retrying."
            exit 1
          fi
          printf '%s' "$APPROVED_INPUTS" | gh workflow run play-internal-release.yml --repo "$GITHUB_REPOSITORY" --ref main --json
          echo "Requested the existing OPS-04 internal publisher with the verified build and digest."
