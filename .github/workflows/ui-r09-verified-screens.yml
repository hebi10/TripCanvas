name: TripCanvas UI-R09 verified real screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/ui-r09-verified-screens.yml'
      - 'scripts/play/build_from_verified_qa.py'
      - 'docs/ui-r09-final-qa-store.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripcanvas-r09-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-renderer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile offline renderer, install test-only fonts/Pillow
        run: |
          python3 -m py_compile scripts/play/build_from_verified_qa.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Prove rendering and manifest validation using non-published dummy PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import hashlib, json, os, zipfile
          root = Path(os.environ['RUNNER_TEMP']) / 'r09-fixtures'
          root.mkdir(parents=True, exist_ok=True)
          names = {
              '2c': ['01-home-light.png', '02a-workspace-overview-light.png',
                     '02d-workspace-schedule-route.png', '03-checklist-light.png',
                     '07-expenses-light.png'],
              '3a': ['03-map-all-light.png'],
              '3b': ['05-settlement-light.png', '08-bookings-light.png'],
          }
          runs = {}
          for kind, group in names.items():
              path = root / f'{kind}.zip'
              with zipfile.ZipFile(path, 'w') as archive:
                  for filename in group:
                      tmp = BytesIO()
                      Image.new('RGB', (1080, 1920), '#EEEEEE').save(tmp, 'PNG')
                      archive.writestr('screenshots/qa/' + filename, tmp.getvalue())
              runs[kind] = {
                  'head_sha': '0'*40, 'conclusion': 'success', 'run_id': 1,
                  'artifact_sha256': hashlib.sha256(path.read_bytes()).hexdigest()
              }
          (root / 'evidence.json').write_text(
              json.dumps({'main_sha': '0'*40, 'runs': runs}), encoding='utf-8')
          PY
          python3 scripts/play/build_from_verified_qa.py \
            --qa-2c "$RUNNER_TEMP/r09-fixtures/2c.zip" \
            --qa-3a "$RUNNER_TEMP/r09-fixtures/3a.zip" \
            --qa-3b "$RUNNER_TEMP/r09-fixtures/3b.zip" \
            --evidence "$RUNNER_TEMP/r09-fixtures/evidence.json" \
            --output "$RUNNER_TEMP/r09-fixtures/generated"
          STAGING="$RUNNER_TEMP/r09-fixtures/generated" python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.play.listing_images import validate_assets
          assert len(validate_assets(Path(os.environ['STAGING']))) == 10
          print('Renderer smoke test passed; dummy images are never published.')
          PY

  capture:
    if: >-
      github.repository == 'hebi10/TripCanvas' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[tripcanvas-ui-r09-capture]'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: 2c
            device: phone
            resolution: 1080x2400
            density: '420'
            runner_script: .github/scripts/run-2c-screen-qa.sh
          - kind: 2c
            device: tablet
            resolution: 1600x2560
            density: '320'
            runner_script: .github/scripts/run-2c-screen-qa.sh
          - kind: 3a
            device: phone
            resolution: 1080x2400
            density: '420'
            runner_script: .github/scripts/run-3a-map-qa.sh
          - kind: 3a
            device: tablet
            resolution: 1600x2560
            density: '320'
            runner_script: .github/scripts/run-3a-map-qa.sh
          - kind: 3b
            device: phone
            resolution: 1080x2400
            density: '420'
            runner_script: .github/scripts/run-3b-screen-qa.sh
          - kind: 3b
            device: tablet
            resolution: 1600x2560
            density: '320'
            runner_script: .github/scripts/run-3b-screen-qa.sh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android UI and verify the workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ${{ matrix.runner_script }} ${{ matrix.resolution }} ${{ matrix.density }}
      - name: Preserve original screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r09-${{ matrix.kind }}-${{ matrix.device }}
          path: qa-output/
          retention-days: 14
          if-no-files-found: error

  stage-listing:
    needs: capture
    if: >-
      github.repository == 'hebi10/TripCanvas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject a superseded main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/hebi10/TripCanvas/git/ref/heads/main --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare supported Korean fonts and offline rendering dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Download genuine Android QA artifacts from this exact main run
        uses: actions/download-artifact@v4
        with:
          pattern: r09-*-phone
          path: evidence
          merge-multiple: false
      - name: Archive each successful phone suite and record exact provenance
        env:
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-r09"
          for kind in 2c 3a 3b; do
            test -d "evidence/r09-$kind-phone"
            (cd "evidence/r09-$kind-phone" && zip -qr "$RUNNER_TEMP/qa-r09/$kind.zip" .)
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'qa-r09'
          runs = {}
          for kind in ('2c', '3a', '3b'):
              data = (root / f'{kind}.zip').read_bytes()
              runs[kind] = {
                  'head_sha': os.environ['EVIDENCE_SHA'],
                  'conclusion': 'success',
                  'run_id': int(os.environ['EVIDENCE_RUN_ID']),
                  'artifact_sha256': hashlib.sha256(data).hexdigest(),
              }
          (root / 'evidence.json').write_text(
              json.dumps({'main_sha': os.environ['EVIDENCE_SHA'], 'runs': runs}, indent=2),
              encoding='utf-8')
          PY
      - name: Compose only real Android screenshots outside-frame captions
        run: |
          python3 scripts/play/build_from_verified_qa.py \
            --qa-2c "$RUNNER_TEMP/qa-r09/2c.zip" \
            --qa-3a "$RUNNER_TEMP/qa-r09/3a.zip" \
            --qa-3b "$RUNNER_TEMP/qa-r09/3b.zip" \
            --evidence "$RUNNER_TEMP/qa-r09/evidence.json" \
            --output "$RUNNER_TEMP/qa-r09/staged-ko-KR"
      - name: Validate 10 PNG signatures dimensions ordering and hashes
        run: |
          STAGING="$RUNNER_TEMP/qa-r09/staged-ko-KR" python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.play.listing_images import validate_assets
          result = validate_assets(Path(os.environ['STAGING']))
          assert len(result) == 10
          print("Ten real-source ko-KR assets staged and SHA-256 verified.")
          PY
      - name: Preserve evidence and staging assets without changing Play
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-r09-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qa-r09/staged-ko-KR/
            ${{ runner.temp }}/qa-r09/evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Require manual visual review before Play listing changes
        run: |
          echo 'Only a review artifact was created; assets/play-store/ko-KR and Google Play are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the eight genuine Android screens and their hashes before authorizing any listing PR or upload.' >> "$GITHUB_STEP_SUMMARY"
