name: TripCanvas 2-C Android Screen QA

on:
  pull_request:
    paths:
      - '.github/workflows/2c-screen-qa.yml'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-qa:
    name: screen-qa-${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            resolution: 1080x2400
            density: '420'
          - device: tablet
            resolution: 1600x2560
            density: '320'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install compile SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture actual Android UI and verify interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p qa-output/screenshots
            adb shell wm size ${{ matrix.resolution }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put system font_scale 1.0
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            set +e
            adb shell am instrument -w -e class com.hebi.tripcanvas.qa.TripCanvas2CScreenshotTest com.hebi.tripcanvas.test/androidx.test.runner.AndroidJUnitRunner | tee qa-output/instrumentation.txt
            instrument_exit=${PIPESTATUS[0]}
            set -e
            adb pull /sdcard/Android/data/com.hebi.tripcanvas/files/qa/ qa-output/screenshots/ || true
            find qa-output -type f -print | sort | tee qa-output/files.txt
            if [ "$instrument_exit" -ne 0 ]; then exit "$instrument_exit"; fi
            if ! grep -q 'OK (1 test)' qa-output/instrumentation.txt; then exit 1; fi

      - name: Upload real emulator screenshot evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcanvas-2c-screens-${{ matrix.device }}
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
